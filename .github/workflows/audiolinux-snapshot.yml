name: audiolinux-snapshot

on:
  push:
    paths: ['audiolinux-snapshot/**', '.github/workflows/audiolinux-snapshot.yml']
  pull_request:
    paths: ['audiolinux-snapshot/**', '.github/workflows/audiolinux-snapshot.yml']

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    container: archlinux:latest      # AudioLinux basiert auf Arch: gleiche Coreutils/util-linux/tar/awk
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge installieren
        run: pacman -Syu --noconfirm --needed shellcheck python procps-ng iproute2 ethtool
      - name: shellcheck
        run: shellcheck -x -S warning audiolinux-snapshot/*.sh audiolinux-snapshot/tests/run-tests.sh
      - name: Tests (Laeufe 2-8)
        env:
          SNAPSHOT_TEST: "1"
        run: bash audiolinux-snapshot/tests/run-tests.sh all
